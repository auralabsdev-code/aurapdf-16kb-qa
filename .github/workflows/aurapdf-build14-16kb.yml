name: AuraPDF build14 stability 16KB
run-name: AuraPDF build14 — one manual 16KB qualification

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Approved public AuraPDF QA repository and public evidence: type BUILD14-PUBLIC-ONE-RUN'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: aurapdf-build14-16kb
  cancel-in-progress: false

jobs:
  stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      QA_SERIAL: emulator-5580
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Enforce public manual first attempt
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          APPROVAL: ${{ inputs.approval }}
        run: |
          mkdir -p evidence
          test "$REPOSITORY_PRIVATE" = false
          test "$RUN_ATTEMPT" = 1
          test "$APPROVAL" = BUILD14-PUBLIC-ONE-RUN
          # Fail closed if a previous dispatch exists, even if it failed or was cancelled.
          gh api "repos/$REPOSITORY/actions/workflows/aurapdf-build14-16kb.yml/runs?event=workflow_dispatch&per_page=1" > evidence/dispatches.json
          python3 -c 'import json; d=json.load(open("evidence/dispatches.json")); assert d["total_count"] == 1, "Only one dispatch authorized; request approval before another run"'
      - name: Verify immutable local inputs
        run: python3 qa/runner.py --verify-only
      - name: Prepare KVM and verify official 16KB image availability
        timeout-minutes: 12
        run: bash qa/prepare-emulator.sh 2>&1 | tee evidence/setup.log
      - name: Run all required scenarios once
        timeout-minutes: 25
        run: python3 qa/runner.py
      - name: Enforce completed successful checks
        if: ${{ always() }}
        run: python3 qa/assert-result.py
      - name: Preserve evidence on success and failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aurapdf-build14-16kb-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
